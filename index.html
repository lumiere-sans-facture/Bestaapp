<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BestaSolar Pro — CRM solaire : pipeline, boutique, devis et commissions" />
    <meta name="theme-color" content="#0a2472" />
    <title>BestaSolar Pro</title>
    <!-- Thème posé avant le premier rendu : sans ça, une préférence « sombre »
         apparaît en clair une fraction de seconde (contexte/ThemeContext.jsx
         gère les changements en cours de session). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bestasolar_theme');
          // Par défaut (aucune clé) et pour un choix explicite « clair » :
          // toujours clair, même sur un système resté en sombre — l'app ne
          // suit l'OS que si « Système » a été choisi EXPRÈS.
          var sombre = t === 'sombre' || (t === 'systeme' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (t === 'sombre' || !t || t === 'clair') document.documentElement.dataset.theme = sombre ? 'dark' : 'light';
          else if (sombre) document.documentElement.dataset.theme = 'dark';
        } catch (e) { /* localStorage indisponible (navigation privée stricte) : reste clair */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Police chargée SANS bloquer l'affichage : l'app s'ouvre aussitôt avec
         la police du téléphone, puis Inter la remplace dès qu'elle arrive.
         En feuille de style ordinaire, tout l'écran attendait Google Fonts —
         des secondes sur un réseau mobile lent. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Le widget de paiement KKiaPay n'est PLUS chargé ici : en script
         ordinaire, il bloquait le démarrage de l'app à chaque ouverture, le
         temps que cdn.kkiapay.me réponde. Il est chargé à la demande par le
         bouton de paiement (components/KkiapayButton.jsx). -->
  </body>
</html>
