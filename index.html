<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BestaSolar Pro — CRM solaire : pipeline, boutique, devis et commissions" />
    <meta name="theme-color" content="#0a2472" />
    <title>BestaSolar Pro</title>
    <!-- Thème posé avant le premier rendu : sans ça, une préférence « sombre »
         apparaît en clair une fraction de seconde (contexte/ThemeContext.jsx
         gère les changements en cours de session). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bestasolar_theme');
          // Un choix explicite (clair/sombre) prime sur la préférence système,
          // y compris quand il la contredit — sinon « Clair » choisi sur un
          // système en sombre clignote en sombre le temps que React monte.
          var sombre = t === 'sombre' || (t !== 'clair' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (t === 'clair' || t === 'sombre') document.documentElement.dataset.theme = sombre ? 'dark' : 'light';
          else if (sombre) document.documentElement.dataset.theme = 'dark';
        } catch (e) { /* localStorage indisponible (navigation privée stricte) : reste clair */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Widget de paiement KKiaPay : clé publique injectée via Vite, jamais ici. -->
  <script src="https://cdn.kkiapay.me/k.js"></script>
</body>
</html>
