name: Release Android (Play Store)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Sans elles, l'app installée depuis le store ne remonterait ni ses
          # plantages (Sentry) ni son usage (PostHog) : ce sont des valeurs
          # PUBLIQUES, à recopier depuis Vercel dans les secrets GitHub.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Sync Capacitor
        run: npx cap sync android

      # Version : celle de package.json. Une étiquette vX.Y.Z doit lui
      # correspondre — sinon on s'arrête plutôt que d'envoyer au Play Store
      # une version dont le numéro ne dit pas ce qu'elle contient.
      - name: Numéro de version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::L'étiquette ${GITHUB_REF_NAME} ne correspond pas à package.json (v${VERSION}). Mettez à jour \"version\" puis ré-étiquetez."
            exit 1
          fi
          echo "VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "Version ${VERSION}"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/upload.keystore

      - name: Build signed AAB (Play Store)
        run: ./gradlew bundleRelease
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build signed APK (distribution directe)
        run: ./gradlew assembleRelease
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bestasolar-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bestasolar-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
